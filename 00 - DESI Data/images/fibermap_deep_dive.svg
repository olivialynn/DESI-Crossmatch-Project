<svg width="100%" viewBox="0 0 860 840" role="img" style="" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBERMAP HDU deep-dive</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The 67 columns of the FIBERMAP HDU grouped into eight analyst-defined thematic clusters for readability.</desc>

  <!-- header -->
  <text x="16" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.05em" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:500;text-anchor:start;dominant-baseline:auto">FIBERMAP · HDU 1 · 1704 rows × 67 columns</text>

  <!-- readability note -->
  <rect x="16" y="32" width="828" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(180, 178, 169);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="51" font-family="sans-serif" font-size="11" fill="#444441" style="fill:rgb(68, 68, 65);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">The clusters below are grouped for readability. DESI stores all 67 columns in a single flat table with no internal grouping.</text>

  <!-- ── IDENTITY & SKY POSITION ── -->
  <rect x="16" y="74" width="828" height="80" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(175, 169, 236);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="93" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C" style="fill:rgb(38, 33, 92);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Identity &amp; sky position</text>
  <text x="30" y="109" font-family="sans-serif" font-size="10" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">TARGETID · TARGET_RA · TARGET_DEC · PLATE_RA · PLATE_DEC · OBJTYPE</text>
  <text x="30" y="123" font-family="sans-serif" font-size="10" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">BRICKID · BRICK_OBJID · BRICKNAME</text>
  <text x="30" y="143" font-family="sans-serif" font-size="10" fill="#7F77DD" style="fill:rgb(127, 119, 221);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Sky coordinates, unique target identifier, and Legacy Survey brick reference.</text>

  <!-- ── IMAGING PHOTOMETRY ── -->
  <rect x="16" y="166" width="828" height="94" rx="8" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(159, 225, 203);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="185" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" style="fill:rgb(4, 52, 44);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Imaging photometry</text>
  <text x="30" y="201" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FLUX_G · FLUX_R · FLUX_Z · FLUX_W1 · FLUX_W2</text>
  <text x="30" y="215" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FLUX_IVAR_G · FLUX_IVAR_R · FLUX_IVAR_Z · FLUX_IVAR_W1 · FLUX_IVAR_W2</text>
  <text x="30" y="229" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBERFLUX_G · FIBERFLUX_R · FIBERFLUX_Z · FIBERTOTFLUX_G · FIBERTOTFLUX_R · FIBERTOTFLUX_Z · EBV</text>
  <text x="30" y="249" font-family="sans-serif" font-size="10" fill="#1D9E75" style="fill:rgb(29, 158, 117);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Pre-imaging fluxes and inverse variances from the Legacy Survey in optical (g, r, z) and mid-infrared (W1, W2) bands. EBV is Milky Way dust reddening.</text>

  <!-- ── MORPHOLOGY & SHAPE ── -->
  <rect x="16" y="272" width="828" height="66" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="291" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Morphology &amp; shape</text>
  <text x="30" y="307" font-family="sans-serif" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MORPHTYPE · SERSIC · SHAPE_R · SHAPE_E1 · SHAPE_E2</text>
  <text x="30" y="327" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Legacy Survey morphological classification and shape parameters. MORPHTYPE distinguishes point sources from extended sources.</text>

  <!-- ── TARGETING FLAGS ── -->
  <rect x="16" y="350" width="828" height="80" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(240, 153, 123);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="369" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C" style="fill:rgb(74, 27, 12);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Targeting flags</text>
  <text x="30" y="385" font-family="sans-serif" font-size="10" fill="#993C1D" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">DESI_TARGET · BGS_TARGET · MWS_TARGET · SCND_TARGET · FA_TARGET · FA_TYPE</text>
  <text x="30" y="399" font-family="sans-serif" font-size="10" fill="#993C1D" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">PRIORITY_INIT · NUMOBS_INIT · OBSCONDITIONS · MASKBITS</text>
  <text x="30" y="419" font-family="sans-serif" font-size="10" fill="#D85A30" style="fill:rgb(216, 90, 48);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Bitmask columns encoding which DESI target classes selected this object (main survey, bright galaxy, Milky Way, secondary programs) and fiber assignment metadata.</text>

  <!-- ── GAIA CROSSMATCH ── -->
  <rect x="16" y="442" width="828" height="80" rx="8" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5" style="fill:rgb(251, 234, 240);stroke:rgb(237, 147, 177);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="461" font-family="sans-serif" font-size="12" font-weight="500" fill="#4B1528" style="fill:rgb(75, 21, 40);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Gaia crossmatch</text>
  <text x="30" y="477" font-family="sans-serif" font-size="10" fill="#993556" style="fill:rgb(153, 53, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">REF_ID · REF_CAT · GAIA_PHOT_G_MEAN_MAG · GAIA_PHOT_BP_MEAN_MAG · GAIA_PHOT_RP_MEAN_MAG</text>
  <text x="30" y="491" font-family="sans-serif" font-size="10" fill="#993556" style="fill:rgb(153, 53, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">PARALLAX · PMRA · PMDEC · REF_EPOCH</text>
  <text x="30" y="511" font-family="sans-serif" font-size="10" fill="#D4537E" style="fill:rgb(212, 83, 126);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Crossmatch to Gaia DR2. REF_CAT identifies the source catalog (e.g. G2 = Gaia DR2), REF_ID is the object identifier within it.</text>

  <!-- ── COADD PROVENANCE ── -->
  <rect x="16" y="534" width="828" height="80" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(133, 183, 235);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="553" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53" style="fill:rgb(4, 44, 83);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Coadd provenance</text>
  <text x="30" y="569" font-family="sans-serif" font-size="10" fill="#185FA5" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">COADD_FIBERSTATUS · COADD_NUMEXP · COADD_EXPTIME · COADD_NUMNIGHT · COADD_NUMTILE</text>
  <text x="30" y="589" font-family="sans-serif" font-size="10" fill="#378ADD" style="fill:rgb(55, 138, 221);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Summary statistics describing how many exposures, nights, and tiles contributed to this coadd.</text>
  <text x="30" y="603" font-family="sans-serif" font-size="10" fill="#378ADD" style="fill:rgb(55, 138, 221);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">COADD_FIBERSTATUS flags fibers with known issues across the coadd.</text>

  <!-- ── FIBER POSITIONING QUALITY ── -->
  <rect x="16" y="626" width="828" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(180, 178, 169);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="645" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" style="fill:rgb(44, 44, 42);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Fiber positioning quality</text>
  <text x="30" y="661" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MEAN_DELTA_X · RMS_DELTA_X · MEAN_DELTA_Y · RMS_DELTA_Y · MEAN_FIBER_RA · STD_FIBER_RA</text>
  <text x="30" y="675" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MEAN_FIBER_DEC · STD_FIBER_DEC · MEAN_PSF_TO_FIBER_SPECFLUX</text>
  <text x="30" y="695" font-family="sans-serif" font-size="10" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Mean and RMS fiber positioning offsets, actual fiber RA/Dec across exposures, and the PSF-to-fiber flux correction factor.</text>

  <!-- ── LEGACY SURVEY BOOKKEEPING ── -->
  <rect x="16" y="718" width="828" height="66" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="737" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" style="fill:rgb(44, 44, 42);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Legacy Survey bookkeeping</text>
  <text x="30" y="753" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">RELEASE · PHOTSYS · SUBPRIORITY</text>
  <text x="30" y="773" font-family="sans-serif" font-size="10" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Legacy Survey data release version, photometric system identifier (N or S for north/south imaging), and fiber assignment subpriority.</text>

  <!-- bottom note -->
  <rect x="16" y="800" width="828" height="30" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="819" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBERMAP · 1704 rows × 67 columns · one row per coadded target.</text>

</svg>