<svg width="100%" viewBox="0 0 860 570" role="img" style="" xmlns="http://www.w3.org/2000/svg"><defs><mask id="imagine-text-gaps-fls15m" maskUnits="userSpaceOnUse"><rect x="0" y="0" width="860" height="680" fill="white"/><rect x="10.009251594543457" y="12.037004470825195" width="426.8934020996094" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="40.041629791259766" width="596.7639770507812" height="15.944493293762207" fill="black" rx="2"/><rect x="24.00925064086914" y="81.04625701904297" width="63.9997673034668" height="16.93986701965332" fill="black" rx="2"/><rect x="24.00925064086914" y="99.03700256347656" width="275.2381286621094" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="119.03700256347656" width="456.057861328125" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="159.04624938964844" width="111.55875396728516" height="16.93986701965332" fill="black" rx="2"/><rect x="24.00925064086914" y="177.03700256347656" width="216.27215576171875" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="197.03700256347656" width="564.852294921875" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="237.04624938964844" width="143.3908233642578" height="16.93986701965332" fill="black" rx="2"/><rect x="24.00925064086914" y="255.03701782226562" width="381.6436767578125" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="269.0370178222656" width="386.7996826171875" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="283.0370178222656" width="354.1116027832031" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="303.0370178222656" width="547.4730224609375" height="14.949119567871094" fill="black" rx="2"/><rect x="366.0087890625" y="345.0416259765625" width="127.98242950439453" height="15.944493293762207" fill="black" rx="2"/><rect x="314.3687744140625" y="359.0462646484375" width="231.2624969482422" height="16.93986701965332" fill="black" rx="2"/><rect x="24.00925064086914" y="410.0462646484375" width="186.72943115234375" height="16.93986701965332" fill="black" rx="2"/><rect x="24.00925064086914" y="430.0370178222656" width="547.0748901367188" height="14.949119567871094" fill="black" rx="2"/><rect x="38.00925064086914" y="451.0508728027344" width="58.38585662841797" height="17.935242652893066" fill="black" rx="2"/><rect x="38.00925064086914" y="466.0370178222656" width="265.1649475097656" height="14.949119567871094" fill="black" rx="2"/><rect x="432.0092468261719" y="451.0508728027344" width="58.38585662841797" height="17.935242652893066" fill="black" rx="2"/><rect x="432.0092468261719" y="466.0370178222656" width="265.7621765136719" height="14.949119567871094" fill="black" rx="2"/><rect x="24.00925064086914" y="516.0416259765625" width="585.27734375" height="15.944493293762207" fill="black" rx="2"/><rect x="24.00925064086914" y="532.0416259765625" width="482.8732604980469" height="15.944493293762207" fill="black" rx="2"/></mask></defs>
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">EXP_FIBERMAP and derived columns</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The 26 columns of EXP_FIBERMAP grouped into three analyst-defined clusters, aggregated by TARGETID to derive MJD_MIN and MJD_MAX for the output catalog.</desc>

  <!-- header -->
  <text x="16" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.05em" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:500;text-anchor:start;dominant-baseline:auto">EXP_FIBERMAP · HDU 2 · 2356 rows × 26 columns · one row per exposure per fiber</text>

  <!-- readability note -->
  <rect x="16" y="32" width="828" height="30" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(180, 178, 169);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="51" font-family="sans-serif" font-size="11" fill="#444441" style="fill:rgb(68, 68, 65);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">The clusters below are grouped for readability. DESI stores all 26 columns in a single flat table with no internal grouping.</text>

  <!-- ── IDENTIFIERS ── -->
  <rect x="16" y="74" width="828" height="66" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5" style="fill:rgb(238, 237, 254);stroke:rgb(175, 169, 236);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="93" font-family="sans-serif" font-size="12" font-weight="500" fill="#26215C" style="fill:rgb(38, 33, 92);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Identifiers</text>
  <text x="30" y="109" font-family="sans-serif" font-size="10" fill="#534AB7" style="fill:rgb(83, 74, 183);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">TARGETID · EXPID · TILEID · NIGHT · FIBER · LOCATION</text>
  <text x="30" y="129" font-family="sans-serif" font-size="10" fill="#7F77DD" style="fill:rgb(127, 119, 221);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Links each row back to a specific target, exposure, tile, and physical fiber location on the focal plane.</text>

  <!-- ── TIMING & EXPOSURE ── -->
  <rect x="16" y="152" width="828" height="66" rx="8" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(159, 225, 203);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="171" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" style="fill:rgb(4, 52, 44);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Timing &amp; exposure</text>
  <text x="30" y="187" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MJD · EXPTIME · PRIORITY · SUBPRIORITY</text>
  <text x="30" y="207" font-family="sans-serif" font-size="10" fill="#1D9E75" style="fill:rgb(29, 158, 117);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Observation timestamp in Modified Julian Date, exposure duration in seconds, and fiber assignment priority for this exposure.</text>

  <!-- ── FIBER & POSITIONING DETAIL ── -->
  <rect x="16" y="230" width="828" height="90" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5" style="fill:rgb(241, 239, 232);stroke:rgb(180, 178, 169);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="249" font-family="sans-serif" font-size="12" font-weight="500" fill="#2C2C2A" style="fill:rgb(44, 44, 42);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Fiber &amp; positioning detail</text>
  <text x="30" y="265" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBERASSIGN_X · FIBERASSIGN_Y · FIBER_X · FIBER_Y · DELTA_X · DELTA_Y</text>
  <text x="30" y="279" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBER_RA · FIBER_DEC · PLATE_RA · PLATE_DEC · PETAL_LOC · DEVICE_LOC</text>
  <text x="30" y="293" font-family="sans-serif" font-size="10" fill="#5F5E5A" style="fill:rgb(95, 94, 90);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">LAMBDA_REF · NUM_ITER · PSF_TO_FIBER_SPECFLUX · FIBERSTATUS</text>
  <text x="30" y="313" font-family="sans-serif" font-size="10" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Per-exposure fiber position on the focal plane, pointing offsets, actual vs. assigned coordinates, and flux correction factor.</text>

  <!-- ── AGGREGATION ARROW ── -->
  <line x1="430" y1="322" x2="430" y2="394" stroke="#888780" stroke-width="1" stroke-dasharray="4 3" mask="url(#imagine-text-gaps-fls15m)" style="fill:rgb(0, 0, 0);stroke:rgb(136, 135, 128);color:rgb(0, 0, 0);stroke-width:1px;stroke-dasharray:4px, 3px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <polygon points="424,388 430,400 436,388" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- aggregation label box -->
  <rect x="270" y="340" width="320" height="38" rx="6" fill="#ffffff" stroke="#D3D1C7" stroke-width="0.5" style="fill:rgb(255, 255, 255);stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="430" y="356" font-family="sans-serif" font-size="11" font-weight="500" fill="#2C2C2A" text-anchor="middle" style="fill:rgb(44, 44, 42);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:middle;dominant-baseline:auto">GROUP BY TARGETID</text>
  <text x="430" y="371" font-family="sans-serif" font-size="10" fill="#888780" text-anchor="middle" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:middle;dominant-baseline:auto">collapse 2356 exposure rows → 1704 target rows</text>

  <!-- ── DERIVED COLUMNS ── -->
  <rect x="16" y="402" width="828" height="90" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(133, 183, 235);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="422" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53" style="fill:rgb(4, 44, 83);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Derived columns · output catalog</text>
  <text x="30" y="440" font-family="sans-serif" font-size="10" fill="#185FA5" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">These columns do not exist in the FITS file — when HATSifying, they will be computed from EXP_FIBERMAP and added to the output catalog.</text>

  <!-- MJD_MIN box -->
  <rect x="30" y="452" width="380" height="28" rx="6" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.5" style="fill:rgb(181, 212, 244);stroke:rgb(133, 183, 235);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="44" y="464" font-family="monospace" font-size="11" font-weight="500" fill="#042C53" style="fill:rgb(4, 44, 83);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:11px;font-weight:500;text-anchor:start;dominant-baseline:auto">MJD_MIN</text>
  <text x="44" y="476" font-family="sans-serif" font-size="10" fill="#0C447C" style="fill:rgb(12, 68, 124);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">= MIN(MJD) per TARGETID · start of observation window</text>

  <!-- MJD_MAX box -->
  <rect x="424" y="452" width="406" height="28" rx="6" fill="#B5D4F4" stroke="#85B7EB" stroke-width="0.5" style="fill:rgb(181, 212, 244);stroke:rgb(133, 183, 235);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="438" y="464" font-family="monospace" font-size="11" font-weight="500" fill="#042C53" style="fill:rgb(4, 44, 83);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:11px;font-weight:500;text-anchor:start;dominant-baseline:auto">MJD_MAX</text>
  <text x="438" y="476" font-family="sans-serif" font-size="10" fill="#0C447C" style="fill:rgb(12, 68, 124);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">= MAX(MJD) per TARGETID · end of observation window</text>

  <!-- bottom note -->
  <rect x="16" y="510" width="828" height="42" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="527" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">MJD_MIN and MJD_MAX describe the time range spanned by all exposures contributing to the coadd for each target.</text>
  <text x="30" y="543" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">I'm assuming that these would be useful when crossmatching DESI spectra to time-domain surveys and transient catalogs.</text>

</svg>