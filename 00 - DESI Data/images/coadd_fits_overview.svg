  <!-- ── SCORES ── -->
  <rect x="32" y="522" width="796" height="66" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="46" y="543" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:start;dominant-baseline:auto">SCORES</text>
  <text x="46" y="557" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDU 18 · 1704 rows × 42 columns</text>
  <text x="46" y="576" font-family="sans-serif" font-size="11" fill="#633806" style="fill:rgb(99, 56, 6);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">Per-target signal-to-noise and spectral quality metrics across all three cameras.</text>

  <!-- bottom note -->
  <rect x="16" y="604" width="828" height="42" rx="8" fill="none" stroke="#D3D1C7" stroke-width="0.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="620" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">FIBERMAP, the spectral arrays, and SCORES all share the same 1704-target row axis —</text>
  <text x="30" y="636" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">each row index refers to the same fiber across all science HDUs.</text>

</svg>