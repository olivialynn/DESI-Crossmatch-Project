  <line x1="32" y1="274" x2="828" y2="274" stroke="#E8E6DF" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(232, 230, 223);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── SPECTRAL HDUs ── -->
  <rect x="32" y="284" width="796" height="216" rx="8" fill="#E1F5EE" stroke="#9FE1CB" stroke-width="0.5" style="fill:rgb(225, 245, 238);stroke:rgb(159, 225, 203);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="46" y="305" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C" style="fill:rgb(4, 52, 44);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:start;dominant-baseline:auto">Spectral HDUs</text>
  <text x="46" y="319" font-family="sans-serif" font-size="10" fill="#1D9E75" style="fill:rgb(29, 158, 117);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDUs 3–17 · five HDUs per camera · 1704 targets each</text>
  <text x="46" y="338" font-family="sans-serif" font-size="11" fill="#085041" style="fill:rgb(8, 80, 65);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">DESI's spectrograph splits incoming light into three wavelength ranges using dichroic mirrors.</text>
  <text x="46" y="352" font-family="sans-serif" font-size="11" fill="#085041" style="fill:rgb(8, 80, 65);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">Each produces five HDUs at the same level in the file — wavelength grid, flux, inverse variance, pixel mask, and resolution matrix.</text>

