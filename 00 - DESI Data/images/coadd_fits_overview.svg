  <rect x="46" y="366" width="240" height="56" rx="6" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5" style="fill:rgb(230, 241, 251);stroke:rgb(133, 183, 235);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="62" y="386" font-family="sans-serif" font-size="11" font-weight="500" fill="#042C53" style="fill:rgb(4, 44, 83);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:start;dominant-baseline:auto">B · blue</text>
  <text x="62" y="402" font-family="sans-serif" font-size="10" fill="#185FA5" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">3600–5800 Å · 2751 bins</text>
  <text x="62" y="416" font-family="sans-serif" font-size="10" fill="#185FA5" style="fill:rgb(24, 95, 165);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDUs 3–7</text>

  <!-- R chip -->
  <rect x="298" y="366" width="240" height="56" rx="6" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5" style="fill:rgb(250, 236, 231);stroke:rgb(240, 153, 123);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="314" y="386" font-family="sans-serif" font-size="11" font-weight="500" fill="#4A1B0C" style="fill:rgb(74, 27, 12);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:start;dominant-baseline:auto">R · red</text>
  <text x="314" y="402" font-family="sans-serif" font-size="10" fill="#993C1D" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">5760–7620 Å · 2326 bins</text>
  <text x="314" y="416" font-family="sans-serif" font-size="10" fill="#993C1D" style="fill:rgb(153, 60, 29);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDUs 8–12</text>

  <!-- Z chip -->
  <rect x="550" y="366" width="240" height="56" rx="6" fill="#FBEAF0" stroke="#ED93B1" stroke-width="0.5" style="fill:rgb(251, 234, 240);stroke:rgb(237, 147, 177);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="566" y="386" font-family="sans-serif" font-size="11" font-weight="500" fill="#4B1528" style="fill:rgb(75, 21, 40);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:500;text-anchor:start;dominant-baseline:auto">Z · near-infrared</text>
  <text x="566" y="402" font-family="sans-serif" font-size="10" fill="#993556" style="fill:rgb(153, 53, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">7520–9824 Å · 2881 bins</text>
  <text x="566" y="416" font-family="sans-serif" font-size="10" fill="#993556" style="fill:rgb(153, 53, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDUs 13–17</text>

  <!-- arrays lines -->
  <text x="46" y="442" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Arrays per camera: WAVELENGTH · FLUX · IVAR · MASK · RESOLUTION</text>
  <text x="46" y="458" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Shape example (B): WAVELENGTH (2751,) · FLUX (2751 × 1704) · IVAR (2751 × 1704) · MASK (2751 × 1704) · RESOLUTION (2751 × 11 × 1704)</text>
  <text x="46" y="474" font-family="sans-serif" font-size="10" fill="#0F6E56" style="fill:rgb(15, 110, 86);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">R and Z follow the same pattern with their respective bin counts.</text>

