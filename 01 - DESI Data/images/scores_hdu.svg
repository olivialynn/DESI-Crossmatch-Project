<svg width="100%" viewBox="0 0 860 340" role="img" style="" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">SCORES HDU</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The SCORES HDU contains 42 per-target signal-to-noise and quality metric columns across the B, R, and Z cameras.</desc>

  <!-- header -->
  <text x="16" y="22" font-family="sans-serif" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.05em" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:500;text-anchor:start;dominant-baseline:auto">SCORES · HDU 18 · 1704 rows × 42 columns</text>

  <!-- main block -->
  <rect x="16" y="32" width="828" height="240" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <text x="30" y="54" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:start;dominant-baseline:auto">SCORES</text>
  <text x="30" y="70" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDU 18 · 1704 rows × 42 columns · one row per target · all float32 except TARGETID (int64)</text>

  <line x1="30" y1="80" x2="832" y2="80" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- TARGETID -->
  <text x="30" y="98" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Target identifier</text>
  <text x="30" y="114" font-family="monospace" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">TARGETID</text>
  <text x="160" y="114" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Unique target identifier — joins to FIBERMAP and the spectral arrays on row index.</text>

  <line x1="30" y1="124" x2="832" y2="124" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- SNR columns -->
  <text x="30" y="142" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Signal-to-noise metrics</text>
  <text x="30" y="158" font-family="monospace" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MEDIAN_CALIB_SNR_B · MEDIAN_CALIB_SNR_R · MEDIAN_CALIB_SNR_Z</text>
  <text x="30" y="172" font-family="monospace" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">MEDIAN_COADD_SNR_B · MEDIAN_COADD_SNR_R · MEDIAN_COADD_SNR_Z</text>
  <text x="30" y="186" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Median SNR per camera, computed over calibrated individual exposures and over the final coadd.</text>

  <line x1="30" y1="196" x2="832" y2="196" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- flux and continuity metrics -->
  <text x="30" y="214" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:12px;font-weight:500;text-anchor:start;dominant-baseline:auto">Flux &amp; continuity metrics</text>
  <text x="30" y="230" font-family="monospace" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">FLUX_SNR_B · FLUX_SNR_R · FLUX_SNR_Z  ·  CONTINUUM_SNR_B · CONTINUUM_SNR_R · CONTINUUM_SNR_Z</text>
  <text x="30" y="244" font-family="monospace" font-size="10" fill="#854F0B" style="fill:rgb(133, 79, 11);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:monospace;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">TSNR2_BGS · TSNR2_ELG · TSNR2_LRG · TSNR2_QSO · TSNR2_LYA · ... (per camera variants)</text>
  <text x="30" y="258" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">Template SNR² values (TSNR2) measure effective depth for specific target classes: BGS, ELG, LRG, QSO, LyA.</text>

  <!-- bottom note -->
  <rect x="16" y="288" width="828" height="42" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="30" y="305" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">SCORES shares the 1704-target row axis with FIBERMAP and the spectral arrays. Column names follow the pattern</text>
  <text x="30" y="321" font-family="sans-serif" font-size="11" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">{METRIC}_{CAMERA} — e.g. MEDIAN_COADD_SNR_B, TSNR2_ELG_R. Not all 42 column names are listed above.</text>

</svg>