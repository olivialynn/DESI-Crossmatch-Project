  <line x1="14" y1="322" x2="606" y2="322" stroke="#E8E6DF" stroke-width="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(232, 230, 223);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- ── TSNR2 ── -->
  <rect x="14" y="330" width="592" height="96" rx="8" fill="#FAEEDA" stroke="#FAC775" stroke-width="0.5" style="fill:rgb(250, 238, 218);stroke:rgb(250, 199, 117);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="26" y="349" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" style="fill:rgb(65, 36, 2);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:13px;font-weight:500;text-anchor:start;dominant-baseline:auto">TSNR2</text>
  <text x="26" y="363" font-family="sans-serif" font-size="10" fill="#BA7517" style="fill:rgb(186, 117, 23);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">HDU 4 · 1704 rows × 33 columns</text>
  <text x="26" y="383" font-family="sans-serif" font-size="11" fill="#633806" style="fill:rgb(99, 56, 6);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">Template SNR² metrics per target class and camera. Columns follow the pattern</text>
  <text x="26" y="397" font-family="sans-serif" font-size="11" fill="#633806" style="fill:rgb(99, 56, 6);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">TSNR2_{TARGET}_{CAMERA} for per-camera values and TSNR2_{TARGET} for camera-summed totals.</text>
  <text x="26" y="411" font-family="sans-serif" font-size="11" fill="#633806" style="fill:rgb(99, 56, 6);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:11px;font-weight:400;text-anchor:start;dominant-baseline:auto">Target classes: ELG, LRG, BGS, QSO, LYA, GPBDARK, GPBBRIGHT, GPBBACKUP.</text>

  <!-- bottom note -->
  <rect x="5" y="460" width="610" height="42" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="12" y="477" font-family="sans-serif" font-size="10" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">REDSHIFTS, FIBERMAP, and TSNR2 all share the same 1704-target row axis — each row index refers to the</text>
  <text x="12" y="491" font-family="sans-serif" font-size="10" fill="#888780" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:400;text-anchor:start;dominant-baseline:auto">same target across all science HDUs, and aligns with the coadd file on TARGETID.</text>

</svg>