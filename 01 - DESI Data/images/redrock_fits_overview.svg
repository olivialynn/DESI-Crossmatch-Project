<svg width="100%" viewBox="0 0 620 514" role="img" style="" xmlns="http://www.w3.org/2000/svg">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">DESI redrock FITS file structure</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Overview of the 5 HDUs in redrock-main-dark-0.fits: PRIMARY, REDSHIFTS, FIBERMAP, EXP_FIBERMAP, and TSNR2.</desc>

  <!-- header -->
  <text x="5" y="14" font-family="sans-serif" font-size="10" font-weight="500" fill="#888780" letter-spacing="0.05em" style="fill:rgb(136, 135, 128);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:sans-serif;font-size:10px;font-weight:500;text-anchor:start;dominant-baseline:auto">FITS FILE STRUCTURE</text>

  <!-- outer file box -->
  <rect x="5" y="22" width="610" height="422" rx="12" fill="none" stroke="#D3D1C7" stroke-width="1.5" style="fill:none;stroke:rgb(211, 209, 199);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

